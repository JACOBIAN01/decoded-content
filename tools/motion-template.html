<!doctype html><meta charset="utf-8"><title>Decoded motion template v3</title>
<!-- Starter for a Decoded motion graphic (v3, muted-first). Copy to weeks/<week>/motion.html, then replace the scenes.
     Contract: window.DURATION + window.render(t). No CSS transitions/animations, no timers. See tools/MOTION-GRAPHICS.md. -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#1D1D1F;--mute:#6E6E73;--blue:#0071E3;--red:#D93025;--green:#1F9D55;--org:#FF9500;--yel:#FFE680;--line:#E5E5EA;--bg:#FBFBFD}
body{width:1080px;height:1350px;background:var(--bg);font-family:Inter,sans-serif;color:var(--ink);overflow:hidden;position:relative}
.abs{position:absolute}
#bar{left:0;top:0;height:8px;background:var(--blue)}
.top{left:60px;right:60px;top:40px;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:30px;font-weight:700;letter-spacing:.08em}.brand span{color:var(--mute);font-weight:600}
#chap{display:flex;gap:10px}
#chap span{font-size:28px;font-weight:700;letter-spacing:.04em;padding:8px 18px;border-radius:999px;background:#EEF0F3;color:#86868B}
#chap span.on{background:var(--ink);color:#fff}
/* frame-0 hook: the biggest thing on screen */
#hook{left:60px;right:60px;top:300px;text-align:center;z-index:30}
#hook .num{font-family:'Inter Display',Inter;font-size:170px;font-weight:800;letter-spacing:-.03em;color:var(--red);white-space:nowrap}
#hook .line{font-family:'Inter Display',Inter;font-size:104px;font-weight:800;letter-spacing:-.025em;line-height:1.02;margin-top:10px}
#q{left:60px;right:60px;top:700px;text-align:center;font-size:64px;font-weight:700;color:var(--blue)}
/* kinetic caption: sits in the stage, next to the action */
.kin{font-family:'Inter Display',Inter;font-size:72px;font-weight:800;line-height:1.08;letter-spacing:-.02em}
.kin .w{display:inline-block;margin-right:.24em;white-space:nowrap}
.kin .w.hi{background:var(--yel);border-radius:12px;padding:0 10px;margin-left:-10px}
#k1{left:60px;right:60px;top:170px}
#sup{left:60px;right:60px;top:1030px;font-size:44px;font-weight:600;color:#424245;line-height:1.25}
/* stage props */
#sys{left:200px;top:440px;width:680px;height:480px;background:#fff;border-radius:40px;border:2px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.06)}
#sys .lab{position:absolute;left:34px;top:26px;font-size:36px;font-weight:700;color:var(--mute)}
#data{left:240px;top:200px;padding:20px 28px;background:var(--yel);border-radius:14px;font-family:'DejaVu Sans Mono',monospace;font-size:56px;font-weight:700;white-space:nowrap;box-shadow:0 10px 24px rgba(0,0,0,.12)}
#pk{width:48px;height:48px;border-radius:50%;margin:-24px 0 0 -24px;z-index:25;background:var(--blue)}
#badge{left:60px;top:1170px;font-size:28px;font-weight:700;letter-spacing:.05em;padding:10px 22px;border-radius:999px}
#flash{inset:0;background:var(--red);z-index:40;pointer-events:none}
/* end card: takeaway + binary question */
#end{inset:0;background:var(--bg);z-index:50;padding:200px 60px 0}
#end h1{font-family:'Inter Display',Inter;font-size:84px;line-height:1.05;letter-spacing:-.02em}
#end .opt{margin-top:28px;display:flex;align-items:center;gap:24px;padding:26px 32px;border-radius:28px;background:#fff;border:2px solid var(--line);font-size:48px;font-weight:700}
#end .opt b{width:72px;height:72px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
#end .cta{margin-top:40px;font-size:48px;font-weight:800;color:var(--blue)}
</style>
<div id="bar" class="abs"></div>
<div class="top abs"><div class="brand">DECODED <span>#NN</span></div><div id="chap"><span>1 HOW</span><span>2 WHY</span><span>3 FIX</span></div></div>
<div id="hook" class="abs"><div class="num" id="hn">$0</div><div class="line">Short shock line.</div></div>
<div id="q" class="abs">How did that happen?</div>
<div id="k1" class="abs kin"></div>
<div id="sys" class="abs"><div class="lab">THE SYSTEM</div><div id="data" class="abs">data</div></div>
<div id="pk" class="abs"></div>
<div id="sup" class="abs"></div>
<div id="badge" class="abs"></div><div id="flash" class="abs"></div>
<div id="end" class="abs"><h1>One-line takeaway.</h1>
  <div class="opt" id="o0"><b style="background:var(--blue)">A</b>First answer</div>
  <div class="opt" id="o1"><b style="background:var(--org)">B</b>Second answer</div>
  <div class="cta" id="cta">A or B? Comment below ↓</div></div>
<script>
// ---------- engine (keep) ----------
const $=id=>document.getElementById(id);
const C=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const E=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2, EO=x=>1-Math.pow(1-x,3);
const EB=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const P=(t,a,b,e=E)=>e(C((t-a)/(b-a))), L=(a,b,k)=>a+(b-a)*k;
const win=(t,a,b,fi=.3,fo=.3)=>Math.max(0,Math.min(P(t,a,a+fi,EO),1-P(t,b-fo,b)));
const wins=(t,ws)=>Math.max(0,...ws.map(w=>win(t,...w)));
const at=(list,t)=>{let v=list[0][1];for(const [k,x] of list) if(t>=k) v=x;return v;};
const tf=(el,{x=0,y=0,s=1,r=0,o=1})=>{el.style.transform=`translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`;el.style.opacity=o;};
const shake=(t,a,b,amp)=>t>=a&&t<b?Math.sin((t-a)*70)*amp*(1-(t-a)/(b-a)):0;
const cache={};const txt=(el,v,html)=>{const k=el.id+(html?'h':'t');if(cache[k]===v)return;cache[k]=v;html?el.innerHTML=v:el.textContent=v;};
// kinetic caption: word-by-word reveal between t0 and t1; hi = words to highlight
const words=(el,text,t0,t1,hi=[])=>{
  const key=el.id+'w';if(cache[key]!==text){cache[key]=text;el.innerHTML=text.split(' ').map(w=>`<span class="w${hi.includes(w)?' hi':''}">${w}</span>`).join('');}
  const ws=el.children,n=ws.length,step=(t1-t0)/Math.max(n,1);
  for(let i=0;i<n;i++){const k=P(t,t0+i*step,t0+i*step+.25,EO);tf(ws[i],{y:(1-k)*28,o:k});}
};
// counter: eases from -> to between t0 and t1
const count=(el,from,to,t0,t1,fmt=n=>Math.round(n).toLocaleString('en-IN'))=>txt(el,fmt(L(from,to,P(t,t0,t1,EO))));
// chapter strip
const chapters=(t,marks)=>{const cur=at([[0,-1],...marks],t);[...$('chap').children].forEach((s,i)=>s.className=i<=cur?'on':'');};
let t=0; // current time, shared by helpers

// ---------- timeline (replace per topic) ----------
const T=34; window.DURATION=T;
// kinetic captions: [t0, t1, text, highlights]  (≤ 6 words each; reveal over ~0.8 s, hold, then next)
const KIN=[[5,9,'One idea, in one picture.',['picture.']],[9,14,'Here is the cause.',['cause.']],[14,24,'Under the hood: real terms.',['real']],[24,31,'The fix changes one rule.',['fix']]];
const SUP=[[5,14,'Payoff must be clear by 12 s.'],[14,24,'Engineer layer: one causal path.'],[24,31,'Then replay the bug and show it failing.']];
const BADGE=[[0,['our','OUR BUILD']],[5,['our','SIMPLIFIED EXPLAINER']],[14,['doc','DOCUMENTED · SOURCE']],[24,['our','OUR BUILD']]];
const CH=[[5,0],[14,1],[24,2]];

window.render=function(tt){
 t=tt;
 $('bar').style.width=(1080*t/T)+'px'; chapters(t,CH);
 const b=at(BADGE,t),be=$('badge');txt(be,b[1]);be.style.background=b[0]=='doc'?'#E8F1FD':'#F2F2F7';be.style.color=b[0]=='doc'?'#0B5CC4':'#424245';
 // 0 · hook (frame 0 must already read): counter from 0.2 s, line stamps in 0.1–0.5 s
 const hout=P(t,4.4,4.9);
 // frame 0 is fully readable (it is the thumbnail and the loop seam); motion = pulse + shake, not a fade-in
 txt($('hn'),'$6.3B');
 tf($('hook'),{o:1-hout,y:-hout*40});
 tf($('hook').firstElementChild,{s:1+.08*Math.sin(Math.PI*C(t/.6))+.04*Math.sin(Math.PI*C((t-1.6)/.5))});
 tf($('hook').lastElementChild,{x:shake(t,.35,.9,10)});
 // 1 · open loop question (3–4.9 s)
 tf($('q'),{o:win(t,2.6,4.9,.3,.4),y:(1-P(t,2.6,3,EO))*20});
 // kinetic captions
 const ks=KIN.find(k=>t>=k[0]&&t<k[1]),k1=$('k1');
 if(ks){words(k1,ks[2],ks[0]+.1,ks[0]+.9,ks[3]);k1.style.opacity=1-P(t,ks[1]-.25,ks[1]);}else k1.style.opacity=0;
 const ss=SUP.find(s=>t>=s[0]&&t<s[1]),sp=$('sup');
 if(ss){txt(sp,ss[2]);tf(sp,{o:win(t,ss[0]+.4,ss[1],.3,.25)});}else tf(sp,{o:0});
 // 2–4 · stage (replace): something changes every 2–3 s
 const st=win(t,4.6,31.2,.5,.4);tf($('sys'),{o:st,y:(1-P(t,4.6,5.3,EO))*30,x:shake(t,11,11.6,14)});
 const pe=$('pk');if(t>=6&&t<7.2){const k=P(t,6,7.2);pe.style.left=L(80,540,k)+'px';pe.style.top=(L(560,640,k)-Math.sin(Math.PI*k)*80)+'px';pe.style.opacity=1;}else pe.style.opacity=0;
 tf($('data'),{o:win(t,7.2,31,.3,.3),s:L(.85,1,P(t,7.2,7.6,EB))});
 $('flash').style.opacity=.2*win(t,11,11.35,.05,.3);
 // 5 · end card + seamless loop back to frame 0
 const eo=P(t,31,31.4)*(1-P(t,33.6,34));tf($('end'),{o:eo});
 [0,1].forEach(i=>{const k=P(t,31.3+i*.25,31.7+i*.25,EO);tf($('o'+i),{y:(1-k)*24,o:k});});tf($('cta'),{o:P(t,32,32.3)});
 if(t>33.6){tf($('hook'),{o:P(t,33.6,34)});}
};
window.render(0);
if(!navigator.webdriver){const t0=performance.now();(function loop(){window.render(((performance.now()-t0)/1000)%T);requestAnimationFrame(loop)})();}
</script>
